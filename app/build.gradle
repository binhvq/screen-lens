plugins {
    id "com.android.application"
}

android {
    namespace "dev.binh.lensbubble"
    compileSdk 36

    defaultConfig {
        applicationId "dev.binh.lensbubble"
        minSdk 30
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
